<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14"/>
      <stop offset="100%" style="stop-color:#12122a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0066FF"/>
      <stop offset="50%" style="stop-color:#8A3FFC"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="blueviolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF"/>
      <stop offset="100%" style="stop-color:#8A3FFC"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top gradient stripe -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent)"/>

  <!-- Glow circles -->
  <circle cx="900" cy="150" r="300" fill="rgba(0,102,255,0.06)"/>
  <circle cx="200" cy="500" r="200" fill="rgba(138,63,252,0.05)"/>

  <!-- MVPly logo area -->
  <rect x="60" y="48" width="44" height="44" rx="11" fill="url(#blueviolet)"/>
  <text x="82" y="76" font-family="Arial Black, sans-serif" font-size="16" font-weight="900" fill="white" text-anchor="middle">MV</text>
  <text x="118" y="78" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="white">MVPly</text>

  <!-- Confidential badge -->
  <rect x="1010" y="46" width="130" height="28" rx="14" fill="none" stroke="rgba(239,68,68,0.4)" stroke-width="1.5"/>
  <text x="1075" y="65" font-family="monospace" font-size="10" fill="#ef4444" text-anchor="middle" letter-spacing="2">CONFIDENTIAL</text>

  <!-- ID badge -->
  <circle cx="72" cy="160" r="5" fill="#00c96b"/>
  <text x="86" y="165" font-family="monospace" font-size="12" fill="#00c96b" letter-spacing="3">GTM-001 · LEGENDARY</text>

  <!-- Main headline -->
  <text x="60" y="240" font-family="Arial Black, sans-serif" font-size="64" font-weight="900" fill="white">Senior GTM Leader</text>
  <text x="60" y="305" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.5)" font-weight="400">VP Sales · CRO · Head of Sales · DACH + EMEA</text>

  <!-- KPI blocks -->
  <!-- Block 1 -->
  <rect x="60" y="355" width="240" height="110" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="180" y="410" font-family="Arial Black, sans-serif" font-size="38" font-weight="900" text-anchor="middle" fill="url(#blueviolet)">€6.4M</text>
  <text x="180" y="440" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.5)">ARR built from scratch</text>

  <!-- Block 2 -->
  <rect x="320" y="355" width="200" height="110" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="420" y="410" font-family="Arial Black, sans-serif" font-size="38" font-weight="900" text-anchor="middle" fill="url(#blueviolet)">+220%</text>
  <text x="420" y="440" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.5)">YoY Growth Peak</text>

  <!-- Block 3 -->
  <rect x="540" y="355" width="200" height="110" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="640" y="410" font-family="Arial Black, sans-serif" font-size="38" font-weight="900" text-anchor="middle" fill="url(#blueviolet)">115%</text>
  <text x="640" y="440" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.5)">NRR achieved</text>

  <!-- Block 4 -->
  <rect x="760" y="355" width="200" height="110" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="860" y="410" font-family="Arial Black, sans-serif" font-size="38" font-weight="900" text-anchor="middle" fill="url(#blueviolet)">20+</text>
  <text x="860" y="440" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.5)">Years B2B SaaS</text>

  <!-- Power score -->
  <rect x="1020" y="340" width="120" height="120" rx="20" fill="url(#blueviolet)"/>
  <text x="1080" y="410" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="white" text-anchor="middle">97</text>
  <text x="1080" y="435" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="2">PWR</text>

  <!-- Tags -->
  <rect x="60" y="500" width="150" height="28" rx="14" fill="rgba(0,102,255,0.15)" stroke="rgba(0,102,255,0.3)" stroke-width="1"/>
  <text x="135" y="519" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#3385ff" text-anchor="middle">AI-Native GTM</text>

  <rect x="225" y="500" width="130" height="28" rx="14" fill="rgba(138,63,252,0.15)" stroke="rgba(138,63,252,0.3)" stroke-width="1"/>
  <text x="290" y="519" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#a262fd" text-anchor="middle">WbD Certified</text>

  <rect x="370" y="500" width="140" height="28" rx="14" fill="rgba(0,201,107,0.1)" stroke="rgba(0,201,107,0.25)" stroke-width="1"/>
  <text x="440" y="519" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#00c96b" text-anchor="middle">GDPR-AI Expert</text>

  <rect x="525" y="500" width="160" height="28" rx="14" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
  <text x="605" y="519" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">Series B/C Specialist</text>

  <!-- Bottom label -->
  <text x="60" y="590" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.2)" letter-spacing="2">MVPLY VAULT · CONFIDENTIAL · AUTHORIZED DECISION-MAKERS ONLY</text>
</svg>
